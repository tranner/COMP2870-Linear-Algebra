name: Quarto build and deploy

on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site-dir: "_output"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Restore Quarto's freeze output (book and slides projects) and the
      # jupyter-cache dirs so unchanged notebooks aren't re-executed. Freeze
      # invalidates stale entries itself, so the key is per-run: restore the
      # newest cache via restore-keys and always save a fresh one at the end.
      - name: Restore Quarto freeze cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _freeze
            slides/_freeze
            .jupyter_cache
            src/.jupyter_cache
            slides/.jupyter_cache
          key: quarto-freeze-${{ github.run_id }}
          restore-keys: |
            quarto-freeze-

      # Install uv and Python
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      #  Cache uv virtual environment (optional but speeds up dependency install)
      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-

      # Set up Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # match the local version; newer Quarto changes the callout CSS
          version: 1.4.553
          tinytex: true

      # Pre-install LaTeX packages TinyTeX lacks, rather than relying on
      # quarto's on-the-fly tlmgr lookup (flaky)
      - name: Install extra LaTeX packages
        run: |
          # quarto installs TinyTeX without putting tlmgr on PATH, so find it
          tlmgr=$(find "$HOME" -path '*TinyTeX*' -name tlmgr \( -type f -o -type l \) 2>/dev/null | head -n 1)
          if [ -z "$tlmgr" ]; then
            echo "tlmgr not found; TinyTeX-looking dirs under \$HOME:"
            find "$HOME" -maxdepth 3 -iname '*tinytex*' 2>/dev/null
            exit 1
          fi
          echo "Using $tlmgr"
          # CTAN refuses installs from an outdated tlmgr
          "$tlmgr" update --self
          "$tlmgr" install svg trimspaces catchfile transparent

      #  Install dependencies using uv
      - name: Install the project
        run: uv sync --all-extras --dev --locked

      #  Build the Quarto site
      - name: Build site
        run: uv run quarto render

      #  Build Quarto slides separately
      - name: Build slides
        run: |
          mkdir -p _output/slides
          for q in slides/*.qmd; do
            uv run quarto render "$q"
            mv "${q/.qmd/.html}" _output/slides/
            mv "${q/.qmd/_files}" "_output/${q/.qmd/_files}"
          done

      # Save updated Quarto freeze cache
      - name: Save Quarto freeze cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            _freeze
            slides/_freeze
            .jupyter_cache
            src/.jupyter_cache
            slides/.jupyter_cache
          key: quarto-freeze-${{ github.run_id }}

      # Upload built site as artifact
      - name: Upload site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: _output

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: _output

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_output
